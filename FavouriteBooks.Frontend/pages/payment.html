<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Payment - Favourite Books</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/payment.css">

  <link rel="icon" href="https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/72x72/1f4d6.png">
</head>

<body>

  <header id="main-nav"></header>

  <main>
    <section class="page-head">
      <h1>Secure Payment</h1>
      <p class="subtitle">Pay an outstanding invoice.</p>
    </section>

    <!-- Step 1: find the invoice to pay (hidden once an invoice is loaded) -->
    <section class="card" id="findInvoiceCard">
      <h2>Find your invoice</h2>
      <div class="row">
        <div class="field grow">
          <label for="invoiceId" class="req">Invoice ID</label>
          <input type="text" id="invoiceId" placeholder="paste the invoiceId returned by checkout" autocomplete="off">
          <p class="field-error" id="invoiceId-error"></p>
          <p class="hint">Pre-filled automatically if you arrived here from checkout.</p>
        </div>
        <div class="field">
          <label class="spacer">&nbsp;</label>
          <button type="button" id="loadInvoiceBtn">Load invoice</button>
        </div>
      </div>
      <div class="alert" id="invoiceAlert"></div>
    </section>

    <!-- Order summary -->
    <section class="card" id="summaryCard" hidden>
      <h2>Order Summary</h2>
      <dl class="summary-grid">
        <dt>Order ID</dt><dd id="sumOrderId">-</dd>
        <dt>Invoice ID</dt><dd id="sumInvoiceId">-</dd>
        <dt>Issued</dt><dd id="sumIssued">-</dd>
        <dt>Payment due</dt><dd id="sumDue">-</dd>
        <dt>Amount Due</dt><dd id="sumAmount"><strong>-</strong></dd>
        <dt>Status</dt><dd id="sumStatus">-</dd>
      </dl>
    </section>

    <!-- Payment details -->
    <section class="card" id="paymentCard" hidden>
      <h2>Payment details</h2>

      <form id="paymentForm" novalidate>
        <fieldset>
          <legend class="req">Payment method</legend>
          <div class="radio-row">
            <label class="radio"><input type="radio" name="method" value="1"> Credit / Debit Card</label>
            <label class="radio"><input type="radio" name="method" value="2"> PayPal</label>
            <label class="radio"><input type="radio" name="method" value="3"> Afterpay</label>
          </div>
          <p class="field-error" id="method-error"></p>
        </fieldset>

        <!-- Credit / Debit -->
        <fieldset class="method-fields" data-method="1" hidden>
          <legend>Card details</legend>
          <div class="field">
            <label for="cardHolderName" class="req">Cardholder name</label>
            <input type="text" id="cardHolderName" autocomplete="off">
            <p class="field-error" id="cardHolderName-error"></p>
          </div>
          <div class="field">
            <label for="cardNumber" class="req">Card number</label>
            <input type="text" id="cardNumber" inputmode="numeric" placeholder="xxxx xxxx xxxx xxxx" autocomplete="off">
            <p class="field-error" id="cardNumber-error"></p>
          </div>
          <div class="row">
            <div class="field">
              <label for="expiryMonth" class="req">Expiry month</label>
              <input type="text" id="expiryMonth" inputmode="numeric" placeholder="MM" maxlength="2">
              <p class="field-error" id="expiryMonth-error"></p>
            </div>
            <div class="field">
              <label for="expiryYear" class="req">Expiry year</label>
              <input type="text" id="expiryYear" inputmode="numeric" placeholder="YYYY" maxlength="4">
              <p class="field-error" id="expiryYear-error"></p>
            </div>
            <div class="field">
              <label for="cvc" class="req">CVC</label>
              <input type="text" id="cvc" inputmode="numeric" placeholder="xxx" maxlength="4">
              <p class="field-error" id="cvc-error"></p>
            </div>
          </div>
        </fieldset>

        <!-- PayPal -->
        <fieldset class="method-fields" data-method="2" hidden>
          <legend>PayPal</legend>
          <div class="field">
            <label for="payPalEmail" class="req">PayPal email</label>
            <input type="email" id="payPalEmail" placeholder="abc@gmail.com" autocomplete="off">
            <p class="field-error" id="payPalEmail-error"></p>
          </div>
        </fieldset>

        <!-- Afterpay -->
        <fieldset class="method-fields" data-method="3" hidden>
          <legend>Afterpay</legend>
          <div class="field">
            <label for="afterpayEmail" class="req">Afterpay email</label>
            <input type="email" id="afterpayEmail" placeholder="abc@gmail.com" autocomplete="off">
            <p class="field-error" id="afterpayEmail-error"></p>
          </div>
          <div class="field">
            <label for="afterpayMobile" class="req">Mobile number</label>
            <input type="tel" id="afterpayMobile" placeholder="04xx xxx xxx" autocomplete="off">
            <p class="field-error" id="afterpayMobile-error"></p>
          </div>
        </fieldset>

        <!-- Payment Simulation to show success/decline of payment method -->

        <fieldset>
          <legend>Simulated outcome</legend>
          <div class="radio-row">
            <label class="radio"><input type="radio" name="sim" value="Success" checked> Success</label>
            <label class="radio"><input type="radio" name="sim" value="Declined"> Declined</label>
          </div>
        </fieldset>

        <div class="alert" id="paymentAlert"></div>

        <div class="actions">
          <button type="submit" id="payBtn">Pay Now</button>
          <button type="reset" id="resetBtn" class="secondary">Reset form</button>
        </div>
      </form>
    </section>
  </main>

  <footer id="main-footer"></footer>

  <script type="module" src="../js/nav.js"></script>
  <script type="module" src="../js/footer.js"></script>
  <script type="module" src="../js/cart-popout.js"></script>
  <script type="module" src="../js/cart.js"></script>
  <script type="module" src="../js/payment.js"></script>

</body>

</html>
