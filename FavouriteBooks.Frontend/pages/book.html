<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Favourite Books</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/book.css">

  <link rel="icon" href="https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/72x72/1f4d6.png">
</head>

<body>

  <header id="main-nav"></header>

  <main>
    <button id="back-btn" type="button">
      <i class="fa-solid fa-arrow-left"></i> Back to Catalogue
    </button>

    <div class="book-details">
      <div class="book-image">
        <i class="fa-solid fa-book fa-8x" id="book-cover-icon"></i>
      </div>

      <div class="book-info">
        <h1 id="book-title"></h1>

        <p id="book-author"></p>
        <p id="book-description"></p>
        <p id="book-genre"></p>
        <p id="book-stock"></p>
        <p id="book-price"></p>

        <label for="quantity-select" id="quantity-label">Quantity:</label>
        <select id="quantity-select">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
        </select>

        <button id="add-to-cart-btn" type="button">
          <i class="fa-solid fa-cart-plus"></i> Add to Cart
        </button>
      </div>
    </div>
  </main>

  <footer id="main-footer"></footer>

  <script type="module" src="../js/nav.js"></script>
  <script type="module" src="../js/footer.js"></script>
  <script type="module" src="../js/cart-popout.js"></script>
  <script type="module" src="../js/cart.js"></script>
  <script type="module" src="../js/book.js"></script>

</body>

</html>
