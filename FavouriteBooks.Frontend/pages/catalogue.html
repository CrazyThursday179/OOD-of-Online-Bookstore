<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Favourite Books</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/catalogue.css">

  <link rel="icon" href="https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/72x72/1f4d6.png">
</head>
<body>
  
  <header id="main-nav"></header>
    
  <main>
    <div class="search-filter">
      <div> <!-- Search bar -->
        <label for="search-input">Search:</label>
        <input type="text" id="search-input" placeholder="Enter book title or author...">
      </div>
      <div> <!-- Genre filter, gets dynamically populated via backend -->
        <label for="genre-filter">Filter by Genre:</label>
        <select id="genre-filter">
          <option value="">All Genres</option>
        </select>
      </div>
    </div>

    <div id="book-list">
    <!-- Book items will be dynamically inserted here -->
    <!-- For each book item, show an image, list name, author, and price -->
    </div>
  </main>

  <footer id="main-footer"></footer>

  <script type="module" src="../js/nav.js"></script>
  <script type="module" src="../js/footer.js"></script>
  <script type="module" src="../js/cart-popout.js"></script>
  <script type="module" src="../js/catalogue.js"></script>
  <script type="module" src="../js/cart.js"></script>
    
</body>
    
</html>
